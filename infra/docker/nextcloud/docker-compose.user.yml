# Per-user Nextcloud instance template
# This file is used by the provisioning script.
# Variables are substituted at runtime.

version: '3.9'

services:
  nextcloud_${USER_ID}:
    image: ${NEXTCLOUD_DOCKER_IMAGE:-nextcloud:28}
    container_name: nextcloud_${USER_ID}
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - nextcloud_data_${USER_ID}:/var/www/html
    environment:
      # Admin credentials
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SUBDOMAIN}.${BASE_DOMAIN}

      # S3 Object Storage (Cloudflare R2 / Backblaze B2 / Custom)
      OBJECTSTORE_S3_HOST: ${S3_HOST}
      OBJECTSTORE_S3_BUCKET: ${S3_BUCKET}
      OBJECTSTORE_S3_KEY: ${S3_ACCESS_KEY}
      OBJECTSTORE_S3_SECRET: ${S3_SECRET_KEY}
      OBJECTSTORE_S3_PORT: ${S3_PORT:-443}
      OBJECTSTORE_S3_SSL: ${S3_SSL:-true}
      OBJECTSTORE_S3_REGION: ${S3_REGION:-auto}
      OBJECTSTORE_S3_USEPATH_STYLE: "true"

      # Database (shared or per-user)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: nextcloud_${USER_ID}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Mail
      MAIL_FROM_ADDRESS: noreply
      MAIL_DOMAIN: ${BASE_DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_AUTHTYPE: LOGIN
      SMTP_NAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ssl

    networks:
      - saas_network

volumes:
  nextcloud_data_${USER_ID}:

networks:
  saas_network:
    external: true
    name: saas_network
